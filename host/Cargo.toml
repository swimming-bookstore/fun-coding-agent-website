[package]
name = "fun-site"
version = "0.1.0"
edition = "2021"
description = "Serve the Fun website and proxy xAI so the WASM agent can log in"

[[bin]]
name = "fun-site"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
